<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080b12">

<title>Canton Websites Co. | Websites Built for Your Business</title>

<meta name="description"
content="Canton Websites Co. builds modern, affordable websites for small businesses in Canton, Georgia.">

<style>
:root {
  --bg: #080b12;
  --surface: #101521;
  --surface-light: #161e2d;
  --text: #f6f8fc;
  --muted: #a6b0c2;
  --blue: #568cff;
  --blue-light: #86acff;
  --border: rgba(255,255,255,.1);
  --radius: 18px;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  scroll-behavior: smooth;
}

body {
  font-family: Inter, -apple-system, BlinkMacSystemFont,
    "Segoe UI", Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.7;
}

a {
  color: inherit;
  text-decoration: none;
}

button, input, textarea, select {
  font: inherit;
}

button, a {
  -webkit-tap-highlight-color: transparent;
}

.container {
  width: min(1120px, 90%);
  margin: auto;
}

header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(8,11,18,.92);
  backdrop-filter: blur(18px);
  border-bottom: 1px solid var(--border);
}

.nav {
  min-height: 76px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
}

.logo {
  font-size: 19px;
  font-weight: 850;
  letter-spacing: -.7px;
}

.logo span {
  color: var(--blue-light);
}

.nav-links {
  display: flex;
  align-items: center;
  gap: 25px;
  font-size: 13px;
  color: var(--muted);
}

.nav-links a:hover,
.nav-links a.active {
  color: white;
}

.btn {
  display: inline-flex;
  justify-content: center;
  align-items: center;
  gap: 8px;
  padding: 12px 20px;
  border-radius: 10px;
  border: 1px solid var(--border);
  font-size: 14px;
  font-weight: 750;
  cursor: pointer;
  transition: .2s ease;
}

.btn:hover {
  transform: translateY(-2px);
}

.btn-primary {
  background: var(--blue);
  color: white;
  border-color: var(--blue);
}

.btn-primary:hover {
  background: #3d76ef;
}

.btn-secondary {
  background: rgba(255,255,255,.035);
  color: white;
}

.btn-secondary:hover {
  background: rgba(255,255,255,.09);
}

.hero {
  padding: 105px 0 85px;
  text-align: center;
  background:
    radial-gradient(ellipse at 50% 0%,
      rgba(67,115,255,.18), transparent 60%);
}

.eyebrow {
  display: inline-block;
  color: var(--blue-light);
  border: 1px solid rgba(86,140,255,.3);
  background: rgba(86,140,255,.08);
  border-radius: 30px;
  padding: 6px 13px;
  font-size: 12px;
  font-weight: 750;
  margin-bottom: 23px;
}

h1 {
  font-size: clamp(40px, 7vw, 72px);
  line-height: 1.08;
  letter-spacing: -3px;
  max-width: 900px;
  margin: 0 auto 24px;
}

.gradient {
  background: linear-gradient(100deg, #fff, #82aaff);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

.hero p {
  color: var(--muted);
  max-width: 650px;
  margin: 0 auto 30px;
  font-size: 17px;
}

.hero-actions {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 12px;
}

.section {
  padding: 80px 0;
}

.section-heading {
  max-width: 650px;
  margin-bottom: 36px;
}

.section-heading.center {
  text-align: center;
  margin-left: auto;
  margin-right: auto;
}

.section-heading h2 {
  font-size: clamp(29px, 4vw, 43px);
  line-height: 1.2;
  letter-spacing: -1.5px;
  margin-bottom: 14px;
}

.section-heading p {
  color: var(--muted);
}

.grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0,1fr));
  gap: 18px;
}

.card {
  padding: 27px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: linear-gradient(145deg, var(--surface), #0c1019);
  transition: .25s ease;
}

.card:hover {
  transform: translateY(-4px);
  border-color: rgba(86,140,255,.5);
}

.icon {
  display: grid;
  place-items: center;
  width: 45px;
  height: 45px;
  margin-bottom: 20px;
  border-radius: 13px;
  background: rgba(86,140,255,.12);
  color: var(--blue-light);
  font-size: 21px;
}

.card h3 {
  font-size: 20px;
  margin-bottom: 10px;
}

.card p {
  font-size: 14px;
  color: var(--muted);
  margin-bottom: 20px;
}

.text-link {
  color: var(--blue-light);
  font-weight: 750;
  font-size: 14px;
}

.text-link:hover {
  color: white;
}

.split {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 55px;
  align-items: center;
}

.panel {
  background:
    radial-gradient(circle at top right,
      rgba(86,140,255,.17), transparent 55%),
    var(--surface);
  border: 1px solid var(--border);
  border-radius: 24px;
  padding: 35px;
}

.panel h3 {
  font-size: 24px;
  margin-bottom: 15px;
}

.panel p {
  color: var(--muted);
}

.check-list {
  list-style: none;
  margin: 20px 0 26px;
}

.check-list li {
  padding: 8px 0;
  color: #dce4f2;
}

.check-list li::before {
  content: "✓";
  color: var(--blue-light);
  font-weight: 900;
  margin-right: 11px;
}

.steps {
  counter-reset: step;
}

.step {
  position: relative;
  padding: 0 0 26px 58px;
}

.step::before {
  counter-increment: step;
  content: counter(step);
  position: absolute;
  left: 0;
  top: 0;
  display: grid;
  place-items: center;
  width: 39px;
  height: 39px;
  border-radius: 12px;
  background: var(--surface-light);
  border: 1px solid var(--border);
  color: var(--blue-light);
  font-weight: 850;
}

.step h3 {
  font-size: 17px;
  margin-bottom: 4px;
}

.step p {
  color: var(--muted);
  font-size: 14px;
}

.cta {
  text-align: center;
  padding: 60px 30px;
  border: 1px solid rgba(86,140,255,.25);
  border-radius: 24px;
  background:
    radial-gradient(ellipse at top,
      rgba(86,140,255,.17), transparent 75%),
    var(--surface);
}

.cta h2 {
  font-size: clamp(28px,4vw,42px);
  line-height: 1.2;
  margin-bottom: 15px;
}

.cta p {
  color: var(--muted);
  margin-bottom: 24px;
}

footer {
  border-top: 1px solid var(--border);
  padding: 35px 0;
  color: var(--muted);
  font-size: 13px;
}

.footer-inner {
  display: flex;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 18px;
}

.footer-links {
  display: flex;
  flex-wrap: wrap;
  gap: 18px;
}

.footer-links a:hover {
  color: white;
}

/* Dedicated page views */

.page-hero {
  padding: 75px 0 45px;
  background:
    radial-gradient(ellipse at 50% 0%,
      rgba(67,115,255,.14), transparent 65%);
}

.breadcrumb {
  font-size: 13px;
  color: var(--muted);
  margin-bottom: 25px;
}

.breadcrumb a {
  color: var(--blue-light);
}

.page-hero h1 {
  font-size: clamp(36px,6vw,58px);
  letter-spacing: -2px;
  margin: 0 0 20px;
  max-width: 850px;
}

.page-hero p {
  color: var(--muted);
  max-width: 720px;
  font-size: 17px;
}

.page-content {
  min-height: 55vh;
  padding: 25px 0 80px;
}

.price-note {
  font-size: 13px;
  color: var(--muted);
  margin-top: 18px;
}

.form-card {
  max-width: 740px;
  margin: 0 auto;
  padding: 30px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 20px;
}

.form-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 18px;
}

.field {
  margin-bottom: 19px;
}

.field.full {
  grid-column: 1 / -1;
}

label {
  display: block;
  font-size: 13px;
  font-weight: 750;
  margin-bottom: 7px;
}

input, textarea, select {
  width: 100%;
  padding: 13px 14px;
  color: white;
  background: #090d16;
  border: 1px solid var(--border);
  border-radius: 10px;
  outline: none;
}

input:focus, textarea:focus, select:focus {
  border-color: var(--blue);
}

textarea {
  min-height: 135px;
  resize: vertical;
}

select option {
  background: #101521;
}

.form-help {
  color: var(--muted);
  font-size: 12px;
  margin-top: 12px;
}

.empty-message {
  padding: 35px;
  border: 1px solid var(--border);
  border-radius: 16px;
  color: var(--muted);
}

.mobile-menu {
  display: none;
}

@media (max-width: 800px) {
  .nav-links {
    gap: 12px;
    font-size: 12px;
  }

  .grid {
    grid-template-columns: repeat(2,minmax(0,1fr));
  }

  .split {
    grid-template-columns: 1fr;
    gap: 30px;
  }

  .hero {
    padding-top: 75px;
  }
}

@media (max-width: 560px) {
  .nav {
    min-height: 68px;
  }

  .nav-links {
    display: none;
  }

  .mobile-menu {
    display: inline-flex;
  }

  .nav-links.open {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 0;
    position: absolute;
    top: 68px;
    left: 0;
    right: 0;
    padding: 15px 5%;
    background: #0b0f18;
    border-bottom: 1px solid var(--border);
  }

  .nav-links.open a {
    padding: 11px 0;
  }

  h1 {
    letter-spacing: -1.8px;
  }

  .grid {
    grid-template-columns: 1fr;
  }

  .form-grid {
    grid-template-columns: 1fr;
  }

  .field.full {
    grid-column: auto;
  }

  .section {
    padding: 58px 0;
  }

  .panel, .form-card {
    padding: 23px;
  }
}
</style>
</head>

<body>

<header>
  <div class="container nav">
    <a class="logo" href="./" aria-label="Canton Websites Co. Home">

</footer>

<script>
/*
  CANTON WEBSITES CO.
  All page views live in this one file.

  Examples:
  ?page=services
  ?page=starter
  ?page=professional
  ?page=premium
  ?page=custom
  ?page=idea
  ?page=get-started
*/

const BUSINESS_EMAIL = "alexsesma.us@gmail.com";

const app = document.getElementById("app");

const pageInfo = {
  home: {
    title: "Home",
    description: "Modern websites for small businesses."
  },
  services: {
    title: "Our Services",
    description: "Explore website services and packages."
  },
  starter: {
    title: "Starter Website",
    description: "A simple, professional starting point."
  },
  professional: {
    title: "Professional Website",
    description: "More room to showcase your business."
  },
  premium: {
    title: "Premium Website",
    description: "A more complete online presence."
  },
  custom: {
    title: "Custom Websites",
    description: "A website built around your specific idea."
  },
  idea: {
    title: "Tell Us Your Idea",
    description: "Tell us what you want your website to do."
  },
  "get-started": {
    title: "Get Started",
    description: "Tell us about your business and your goals."
  }
};

function getPage() {
  const params = new URLSearchParams(window.location.search);
  const requested = params.get("page") || "home";

  return Object.prototype.hasOwnProperty.call(pageInfo, requested)
    ? requested
    : "not-found";
}

function button(label, page, primary = false) {
  const style = primary ? "btn btn-primary" : "btn btn-secondary";

  return `<a class="${style}" href="?page=${encodeURIComponent(page)}">${label}</a>`;
}

function breadcrumb(current) {
  return `
    <div class="breadcrumb">
      <a href="./">Home</a> &nbsp;/&nbsp; ${current}
    </div>
  `;
}

function pageHero(title, subtitle, current) {
  return `
    <section class="page-hero">
      <div class="container">
        ${breadcrumb(current)}
        <h1>${title}</h1>
        <p>${subtitle}</p>
      </div>
    </section>
  `;
}

function contactCTA(title = "Ready to build something?", text =
  "Tell us about your business, and let's discuss the right website for you.") {
  return `
    <section class="section">
      <div class="container">
        <div class="cta">
          <h2>${title}</h2>
          <p>${text}</p>
          ${button("Tell Us Your Idea →", "idea", true)}
        </div>
      </div>
    </section>
  `;
}

function packagePage(key) {

function servicesPage() {
  return `

    ? "Give us a few details about your business and the website you're looking for."
    : "Describe your website idea, ask about a package, or tell us what you'd like your website to do.";

  return `
    ${pageHero(heading, intro, isStart ? "Get Started" : "Your Idea")}

    <section class="page-content">
      <div class="container">
        <form class="form-card" id="inquiryForm">

          <div class="form-grid">
            <div class="field">
              <label for="name">Your name *</label>
              <input id="name" name="name" required
                placeholder="Your name">

            <div class="field">
              <label for="business">Business name</label>
              <input id="business" name="business"
                placeholder="Your business">
            </div>

              <input id="email" name="email" type="email"
                required placeholder="you@example.com">

              </select>
            </div>

            <div class="field full">
              <label for="idea">Tell us about your website *</label>
              <textarea id="idea" name="idea" required
                placeholder="What does your business do? What pages or features do you need? What should visitors be able to do?"></textarea>
            </div>

          </p>
        </form>

        <p style="text-align:center;color:var(--muted);margin-top:25px">
          Prefer email?
          <a class="text-link"
             href="mailto:${BUSINESS_EMAIL}">
            Contact us directly →
          </a>
        </p>
      </div>
    </section>
  `;
}

function notFoundPage() {
  return `
    ${pageHero(
      "That Page Doesn't Exist Yet.",
      "The link may be incorrect, or the page may not be available.",
      "Page Not Found"
    )}

    <section class="page-content">
      <div class="container" style="text-align:center">
        ${button("Return Home →", "home", true)}
        ${button("View Services", "services")}
      </div>
    </section>
  `;
}

function renderPage() {
  const page = getPage();

  document.title =
    (pageInfo[page]?.title || "Page Not Found") +
    " | Canton Websites Co.";

  switch (page) {
    case "home":
      app.innerHTML = homePage();
      break;

    case "services":
      app.innerHTML = servicesPage();
      break;

    case "starter":
    case "professional":
    case "premium":
      app.innerHTML = packagePage(page);
      break;

    case "custom":
      app.innerHTML = customPage();
      break;

    case "idea":
    case "get-started":
      app.innerHTML = inquiryPage(page);
      break;

    default:
      app.innerHTML = notFoundPage();
  }

  const form = document.getElementById("inquiryForm");

  if (form) {
    form.addEventListener("submit", function(event) {
      event.preventDefault();

      const data = new FormData(form);

      const name = data.get("name");
      const business = data.get("business") || "Not provided";
      const email = data.get("email");
      const packageName = data.get("package");
      const idea = data.get("idea");

      const subject = encodeURIComponent(
        "Website Inquiry - " + packageName
      );

      const body = encodeURIComponent(
        "Website Inquiry\n\n" +
        "Name: " + name + "\n" +
        "Business: " + business + "\n" +
        "Email: " + email + "\n" +
        "Interested in: " + packageName + "\n\n" +
        "Website idea:\n" + idea
      );

      window.location.href =
        "mailto:" + BUSINESS_EMAIL +
        "?subject=" + subject +
        "&body=" + body;
    });
  }

  document.querySelectorAll(".nav-links a").forEach(link => {
    link.classList.remove("active");

    const target = new URL(link.href).searchParams.get("page") || "home";

    if (target === page) {
      link.classList.add("active");
    }
  });

  window.scrollTo(0, 0);
}

document.getElementById("year").textContent =
  new Date().getFullYear();

document.getElementById("menuToggle").addEventListener("click", function() {
  const nav = document.getElementById("navLinks");
  const isOpen = nav.classList.toggle("open");

  this.setAttribute("aria-expanded", String(isOpen));
});

document.getElementById("navLinks").addEventListener("click", function(event) {
  if (event.target.closest("a")) {
    this.classList.remove("open");
    document.getElementById("menuToggle")
      .setAttribute("aria-expanded", "false");
  }
});

window.addEventListener("popstate", renderPage);

renderPage();
</script>
